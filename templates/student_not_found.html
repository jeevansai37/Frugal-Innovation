<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Complaint not found | Campus Services</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="page-shell">
    <section class="card">
      {% if rate_limited %}
      <div class="eyebrow">PLEASE WAIT</div>
      <h1>Try again later</h1>
      <p class="intro">There have been too many unsuccessful attempts for this complaint. Please wait 15 minutes before trying again.</p>
      {% else %}
      <div class="eyebrow">NOT FOUND</div>
      <h1>Complaint not found</h1>
      <p class="intro">The complaint ID or access code was not recognized.</p>
      {% endif %}
      <a class="button-link" href="{{ url_for('student_dashboard') }}">Try again</a>
    </section>
  </main>
</body>
</html>
